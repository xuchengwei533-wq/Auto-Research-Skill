[project]
name = "nightrunner"
version = "0.1.0"
description = "AI-powered overnight experiment runner for machine learning projects"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
nightrunner = "nightrunner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nightrunner"]
