project:
  name: Auto-Research-Skill
files:
  editable:
  - train.py
  protected:
  - prepare.py
  - program.md
  - pyproject.toml
  - uv.lock
  - README.md
  - .env
  - .env.local
  - nightrunner.yaml
execution:
  train_command: uv run train.py
  timeout_seconds: 900
metric:
  name: val_bpb
  lower_is_better: true
agent:
  provider: deepseek
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-v4-pro
  reasoning_effort: high
  thinking_enabled: true
safety:
  require_clean_git: false
  auto_apply_to_main: false
  allow_new_files: false
  allow_dependency_changes: false
logging:
  save_request: true
  save_response: true
  save_run_log: true
